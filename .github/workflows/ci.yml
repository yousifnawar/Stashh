name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c debug

      - name: Self test
        run: .build/debug/Stash --selftest

      - name: Build release app bundle
        run: ./Scripts/build.sh release
